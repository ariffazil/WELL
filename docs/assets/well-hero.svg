<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" font-family="DejaVu Sans, Liberation Sans, sans-serif">
  <defs>
    <marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#5a6270"/>
    </marker>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b1e24"/>
      <stop offset="1" stop-color="#14161a"/>
    </linearGradient>
    <linearGradient id="mirrorface" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22302a"/>
      <stop offset="0.5" stop-color="#2b4237"/>
      <stop offset="1" stop-color="#22302a"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="640" fill="url(#fade)"/>
  <g stroke="#232830" stroke-width="1">
    <line x1="0" y1="278" x2="1280" y2="278"/><line x1="0" y1="500" x2="1280" y2="500"/>
    <line x1="320" y1="0" x2="320" y2="640"/><line x1="960" y1="0" x2="960" y2="640"/>
  </g>

  <!-- Title -->
  <text x="60" y="104" fill="#f2f4f7" font-size="58" font-weight="700">WELL</text>
  <text x="60" y="146" fill="#3fbf7f" font-size="22" letter-spacing="6">TRUTH ABOUT READINESS</text>

  <!-- Human attention: finite (above everything) -->
  <g>
    <rect x="640" y="72" width="580" height="16" rx="8" fill="#1d2229" stroke="#3fbf7f" stroke-width="1.5"/>
    <rect x="642" y="74" width="230" height="12" rx="6" fill="#3fbf7f"/>
    <text x="640" y="60" fill="#9aa4b2" font-size="15">HUMAN ATTENTION — finite · spent, never refunded</text>
    <rect x="838" y="182" width="380" height="54" rx="12" fill="none" stroke="#3fbf7f" stroke-width="2.5"/>
    <text x="1028" y="215" fill="#3fbf7f" font-size="17" font-weight="700" text-anchor="middle">OPERATOR SOVEREIGNTY · final judge</text>
    <line x1="1028" y1="236" x2="1028" y2="330" stroke="#3fbf7f" stroke-width="2.5" stroke-dasharray="6 5"/>
    <text x="1028" y="352" fill="#9aa4b2" font-size="14" text-anchor="middle">the mirror never commands</text>
  </g>

  <!-- Signal cards (left) -->
  <g>
    <rect x="60" y="230" width="240" height="112" rx="14" fill="#1d2229" stroke="#3fbf7f" stroke-width="2"/>
    <text x="180" y="272" fill="#f2f4f7" font-size="23" font-weight="700" text-anchor="middle">HUMAN</text>
    <text x="180" y="298" fill="#f2f4f7" font-size="23" font-weight="700" text-anchor="middle">VITALITY</text>
    <text x="180" y="326" fill="#9aa4b2" font-size="15" text-anchor="middle">fatigue · sleep · energy</text>

    <rect x="60" y="366" width="240" height="112" rx="14" fill="#1d2229" stroke="#3fbf7f" stroke-width="2"/>
    <text x="180" y="408" fill="#f2f4f7" font-size="23" font-weight="700" text-anchor="middle">MACHINE</text>
    <text x="180" y="434" fill="#f2f4f7" font-size="23" font-weight="700" text-anchor="middle">VITALITY</text>
    <text x="180" y="462" fill="#9aa4b2" font-size="15" text-anchor="middle">CPU · swap · services</text>

    <rect x="60" y="502" width="240" height="86" rx="14" fill="#1d2229" stroke="#3fbf7f" stroke-width="2"/>
    <text x="180" y="538" fill="#f2f4f7" font-size="21" font-weight="700" text-anchor="middle">COUPLED RISK</text>
    <text x="180" y="566" fill="#9aa4b2" font-size="15" text-anchor="middle">tired operator × degraded box</text>
  </g>

  <!-- Arrows into the mirror -->
  <g stroke="#5a6270" stroke-width="2.5" marker-end="url(#ah)">
    <line x1="302" y1="286" x2="416" y2="330"/>
    <line x1="302" y1="422" x2="416" y2="422"/>
    <line x1="302" y1="545" x2="416" y2="500"/>
    <line x1="742" y1="422" x2="866" y2="422"/>
  </g>

  <!-- Mirror plane (reflect, not judge) -->
  <g>
    <rect x="422" y="238" width="316" height="352" rx="16" fill="url(#mirrorface)" stroke="#3fbf7f" stroke-width="2.5"/>
    <line x1="580" y1="258" x2="580" y2="570" stroke="#3fbf7f" stroke-width="1" stroke-dasharray="4 6" opacity="0.6"/>
    <path d="M470 300 L560 300 L470 380 L560 380" fill="none" stroke="#9aa4b2" stroke-width="2.5"/>
    <path d="M712 300 L622 300 L712 380 L622 380" fill="none" stroke="#9aa4b2" stroke-width="2.5" opacity="0.55"/>
    <text x="580" y="440" fill="#f2f4f7" font-size="26" font-weight="700" text-anchor="middle">WELL MIRROR</text>
    <text x="580" y="472" fill="#3fbf7f" font-size="17" font-weight="700" text-anchor="middle">REFLECT_ONLY</text>
    <text x="580" y="502" fill="#9aa4b2" font-size="15" text-anchor="middle">reflects · never vetoes</text>
    <text x="580" y="526" fill="#9aa4b2" font-size="15" text-anchor="middle">never diagnoses · never executes</text>
  </g>

  <!-- Output: readiness reflection -->
  <g>
    <rect x="866" y="330" width="352" height="184" rx="14" fill="#1d2229" stroke="#3fbf7f" stroke-width="2"/>
    <text x="1042" y="374" fill="#f2f4f7" font-size="22" font-weight="700" text-anchor="middle">READINESS REFLECTION</text>
    <g>
      <rect x="892" y="398" width="62" height="28" rx="14" fill="#14342b" stroke="#3fbf7f" stroke-width="1.5"/>
      <text x="923" y="417" fill="#3fbf7f" font-size="12" font-weight="700" text-anchor="middle">READY</text>
      <rect x="962" y="398" width="72" height="28" rx="14" fill="#14342b" stroke="#3fbf7f" stroke-width="1.5"/>
      <text x="998" y="417" fill="#3fbf7f" font-size="12" font-weight="700" text-anchor="middle">CAUTION</text>
      <rect x="1042" y="398" width="82" height="28" rx="14" fill="#2a2416" stroke="#c9a227" stroke-width="1.5"/>
      <text x="1083" y="417" fill="#c9a227" font-size="12" font-weight="700" text-anchor="middle">DEGRADED</text>
      <rect x="1132" y="398" width="70" height="28" rx="14" fill="#2a1616" stroke="#d9534f" stroke-width="1.5"/>
      <text x="1167" y="417" fill="#d9534f" font-size="12" font-weight="700" text-anchor="middle">UNSAFE</text>
    </g>
    <text x="1042" y="458" fill="#9aa4b2" font-size="15" text-anchor="middle">honest when data is absent —</text>
    <text x="1042" y="482" fill="#9aa4b2" font-size="15" text-anchor="middle">INSUFFICIENT beats fabricated certainty</text>
  </g>

  <!-- Footer -->
  <text x="60" y="622" fill="#9aa4b2" font-size="17">WELL holds a mirror, not a veto · Operator sovereignty is invariant</text>
  <text x="1220" y="622" fill="#3fbf7f" font-size="16" letter-spacing="3" text-anchor="end">DITEMPA BUKAN DIBERI</text>
</svg>
