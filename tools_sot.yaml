  - well_niat_impact_mirror        # requires niat-specific args
  - well_regulation_recovery
  - well_medical_boundary          # modes: boundary, query
  - well_correction_capacity
  - well_detect_boundary
  - well_sabar_latency
  - well_dark_geometry_mirror      # requires text_or_events arg
  - well_trust_compression
  - well_classify_state
  m_well:
  - well_assess_metabolism         # modes: gradient, flux, coupled, etc.
  - well_compute_metabolic_flux
  - well_signal_coverage           # no mode param — direct call
  - well_health_check              # no mode param — direct call
  g_well:
  - well_assess_livelihood
  federation:
  - well_attest_to_kernel
  - well_handoff_dignity_to_arifos
  - well_handoff_livelihood_to_wealth

resources:
