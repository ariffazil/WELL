organ: WELL
version: 2026.07.25
sot_source: SOMATIC_TOOLS (canonical public surface) + AUTONOMIC_TOOLS (internal)
live_port: 18083
registry_note: Single source of truth. Both manifests and live server derive from this.
audit_2026_07_25:
  tested: 15 tools (8 public + 7 internal)
  all_respond: true
  public_ok: 8
  internal_callable: true
  note: "Internal tools require correct mode args — not all accept generic 'status' mode"

public_tools:  # discoverable via tools/list (somatic boundary enforced)
- name: well_classify_substrate
  domain: G-WELL
  omega: Ω-WELL-01
  valid_modes: [substrate, boundary, classification, init, assert, bootstrap, classify, medical]
  description: Classify human/machine/coupled substrate type and boundary sensing

- name: well_trace_lineage
  domain: C-WELL
  omega: Ω-WELL-02
  valid_modes: [decision, evidence, memory, recall, trend, context, ledger, chain]
  description: Memory, trend, ledger, and vault chain tracing

- name: well_assess_homeostasis
  domain: H-WELL
  omega: Ω-WELL-06
  valid_modes: [sleep, cognitive, stress, vitality, circadian, fatigue, empathize, critique, dignity, redteam, maruah, medical_query]
  description: Assess regulation, stability, sleep, fatigue, and empathic balance

- name: well_check_repair
  domain: M-WELL
  omega: Ω-WELL-07
  valid_modes: [precheck]
  description: Check repair, recovery, resilience, and forge cycle integrity

- name: well_validate_vitality
  domain: H-WELL
  omega: Ω-WELL-08
  valid_modes: [readiness, classify]
  description: Validate vitality, readiness, and NIAT before irreversible action

- name: well_assess_reliability
  domain: M-WELL
  omega: Ω-WELL-10
  valid_modes: [health, vitals, machine, model]
  description: Assess machine, tool, institution, and operational reliability

- name: well_guard_dignity
  domain: H-WELL
  omega: Ω-WELL-12
  valid_modes: [consent, boundary, shadow]
  description: Guard soul, personhood, meaning, and symbolic boundaries

- name: well_registry_status
  domain: Federation
  valid_modes: [status, full]
  description: WELL registry truth diagnostic — blueprint canonical format
  test_result:
    ok: true
    intended_tools: 8
    registered_tools: 8
    exported_tools: 8
    callable_tools: 14
    phantom_tools_count: 0
    verdict: REGISTRY_PASS

internal_tools:  # callable via tools/call, hidden from tools/list
  h_well:
  - well_assess_sovereign_entropy  # modes: current, assess, protect, baseline
