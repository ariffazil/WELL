[project]
name = "well-mcp"
version = "2026.10.28"
description = "WELL — Human Substrate Governance Layer MCP Server"
requires-python = ">=3.12"
dependencies = [
    "fastmcp[tasks]==4.1.6",
    "pydantic>=2.13.4",
    "httpx>=0.28.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

# This repo is a flat layout with many top-level directories, so setuptools'
# automatic discovery aborts with "Multiple top-level packages discovered".
# Declare the distributions explicitly; top-level modules (server.py, etc.)
# are imported from the repo root by the test suite and are not packaged.
[tool.setuptools]
packages = [
    "well_mcp",
    "well_v2",
    "well_triad",
    "well_witness",
    "sensors",
    "engines",
    "contracts",
    "loop",
    "prompts",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--ignore=CLAUDE.md --ignore=AGENTS.md"
