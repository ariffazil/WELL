[project]
name = "well-mcp"
version = "2026.08.19"
description = "WELL — Human Substrate Governance Layer MCP Server"
requires-python = ">=3.12"
dependencies = [
    "fastmcp[tasks]==3.4.6",
    "pydantic>=2.13.4",
    "httpx>=0.28.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--ignore=CLAUDE.md --ignore=AGENTS.md"
